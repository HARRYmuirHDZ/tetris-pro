<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="game-container">
    <div class="left-panel">
      <h2>HOLD</h2>
      <canvas id="hold" width="120" height="120"></canvas>

      <h2>SCORE</h2>
      <div id="score">0</div>

      <h2>LEVEL</h2>
      <div id="level">1</div>

      <h2>LINES</h2>
      <div id="lines">0</div>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>

      <!-- OVERLAY (PAUSA / GAME OVER) -->
      <div id="overlay" class="overlay hidden" aria-hidden="true">
        <div class="overlay-box">
          <div id="overlayTitle" class="overlay-title">PAUSED</div>
          <div id="overlayHint" class="overlay-hint">Press P to resume</div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <h2>NEXT</h2>
      <canvas id="next" width="120" height="360"></canvas>

      <div class="hotkeys">
        <div><b>P</b> Pause</div>
        <div><b>R</b> Restart</div>
        <div><b>C</b> Hold</div>
        <div><b>Space</b> Hard drop</div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
